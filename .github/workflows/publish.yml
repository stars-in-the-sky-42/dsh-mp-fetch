name: publish

on:
  # 暂不自动发布 npm。等 npm 配好 Trusted Publisher 后，
  # 再把下面三行 push/tags 打开，或手动运行本 workflow。
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: npm publish --access public --provenance
